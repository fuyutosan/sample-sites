<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ひだまり珈琲店 — ORDER TERMINAL</title><style>
:root{--bg:#101714;--fg:#b8f7c4;--dim:#6ba777;--amber:#ffd27d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:'Courier New',monospace;word-break:keep-all;overflow-wrap:anywhere;text-wrap:balance}body:before{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(184,247,196,.035) 4px);z-index:2}.shell{max-width:1100px;margin:auto;padding:28px 4vw}.bar{border:1px solid var(--dim);padding:12px;display:flex;justify-content:space-between;font-size:13px}.prompt{color:var(--amber)}h1{font-size:clamp(2.6rem,8vw,7rem);line-height:.88;margin:12vh 0 7vh;letter-spacing:-.1em;animation:blink 2.8s steps(2,end) infinite}.cursor{display:inline-block;background:var(--fg);width:.5em;height:.85em;animation:blink 1s steps(2,end) infinite}.log{border-top:1px solid var(--dim);border-bottom:1px solid var(--dim);padding:18px 0;line-height:1.8}.line{display:grid;grid-template-columns:100px 1fr 100px;border-bottom:1px dashed #315c3a;padding:10px 0}.line:last-child{border:0}.price{text-align:right;color:var(--amber)}.foot{display:flex;justify-content:space-between;margin-top:24px;color:var(--dim);font-size:12px}@keyframes blink{50%{opacity:.25}}@media(max-width:640px){.shell{padding:16px}.bar{font-size:10px;gap:10px}.bar span:last-child{display:none}h1{font-size:clamp(3.2rem,17vw,6rem);margin:12vh 0 8vh}.line{grid-template-columns:58px 1fr 70px;font-size:12px;gap:5px}.foot{display:block;line-height:2.1}}@media(prefers-reduced-motion:reduce){h1,.cursor{animation:none}}
</style></head><body><main class="shell"><header class="bar"><span><span class="prompt">root@hidamari:~$</span> status</span><span>自家焙煎 / ONLINE</span></header><h1>COFFEE<span class="cursor"></span><br>ORDER<br>BOARD</h1><section class="log"><div><span class="prompt">$ menu --today</span> / ひだまり珈琲店</div><div class="line"><span>001</span><span>ブレンド<br><small>産地直送の豆 / 手網焙煎の香り</small></span><span class="price">500円</span></div><div class="line"><span>002</span><span>カフェラテ</span><span class="price">550円</span></div><div class="line"><span>003</span><span>季節のケーキ</span><span class="price">480円</span></div></section><footer class="foot"><span>みなと中央駅 / 8:00〜19:00</span><span>日曜定休　$ exit</span></footer><p class="prompt">街の片隅で、香り立つ一杯を。</p></main></body></html>
