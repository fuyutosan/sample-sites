<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひだまり珈琲店｜ナチュラル・木目調</title>
<style>
  body{
    word-break: keep-all;
    overflow-wrap: anywhere;
    text-wrap: pretty;
    margin:0; font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
    background:#f7f1e6; color:#4a3826;
  }
  h1,h2,h3,h4{ text-wrap: balance; }
  .nb{ white-space: nowrap; }
  .url,code{ word-break: break-all; }

  .shell{ max-width:900px; margin:0 auto; }
  header.hero{
    padding:70px 24px 60px; text-align:center;
    background: radial-gradient(circle at 30% 20%, #e8d5b5, #d8b98a 70%);
    border-bottom:8px solid #a9784a;
  }
  header.hero h1{ font-size:2.2rem; margin:0 0 12px; letter-spacing:.05em; }
  header.hero p{ font-size:1.05rem; opacity:.85; }
  section{ padding:48px 24px; }
  .kodawari{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:24px; }
  .card{
    background:#fffdf8; border:2px solid #d8b98a; border-radius:24px;
    padding:24px; box-shadow:0 6px 0 #d8b98a;
  }
  .card h3{ margin-top:0; color:#a9784a; }
  .menu{ list-style:none; padding:0; }
  .menu li{ display:flex; justify-content:space-between; padding:14px 0; border-bottom:1px dashed #c9a876; }
  footer{ background:#4a3826; color:#f7f1e6; text-align:center; padding:36px 24px; }
  .btn{
    display:inline-block; margin-top:16px; padding:14px 32px; border-radius:999px;
    background:#a9784a; color:#fff; text-decoration:none; font-weight:bold;
  }
</style>
</head>
<body>
<div class="shell">
  <header class="hero">
    <h1><span class="nb">ひだまり珈琲店</span></h1>
    <p>街の片隅で、香り立つ一杯を</p>
    <a class="btn" href="#">ご予約はこちら</a>
  </header>

  <section class="kodawari">
    <div class="card"><h3>自家焙煎</h3><p>毎朝、店の奥で豆を焙煎しています。焼きたての香りが店内いっぱいに広がります。</p></div>
    <div class="card"><h3>産地直送の豆</h3><p>生産者から直接仕入れた豆だけを使い、季節ごとに味わいが変わります。</p></div>
    <div class="card"><h3>手網焙煎の香り</h3><p>週末は店頭で手網焙煎の実演も。焙煎したての香りをその場で楽しめます。</p></div>
  </section>

  <section>
    <h2>メニュー</h2>
    <ul class="menu">
      <li><span>ブレンド</span><span>500円</span></li>
      <li><span>カフェラテ</span><span>550円</span></li>
      <li><span>季節のケーキ</span><span>480円</span></li>
    </ul>
  </section>

  <footer>
    <p><span class="nb">みなと中央駅</span>から徒歩5分</p>
    <p>営業時間：8:00〜19:00（日曜定休）</p>
  </footer>
</div>

<script type="module">
  function tidyCJKWhitespace(root){
    const CJK = /[　-ヿ㐀-䶿一-鿿ｦ-ﾟ]/;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let n;
    while((n = walker.nextNode())){
      n.nodeValue = n.nodeValue.replace(
        /([^\s])[ \t]*\n[ \t]*([^\s])/g,
        (m, a, b) => CJK.test(a) && CJK.test(b) ? a + b : a + ' ' + b
      );
    }
  }
  try{
    const { loadDefaultJapaneseParser } = await import('https://cdn.jsdelivr.net/npm/budoux@0.6.2/+esm');
    const parser = loadDefaultJapaneseParser();
    document.querySelectorAll('.shell').forEach(el => { tidyCJKWhitespace(el); parser.applyToElement(el); });
  }catch(e){}
</script>
</body>
</html>
