<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひだまり珈琲店｜モノトーン・ミニマル</title>
<style>
  body{
    word-break: keep-all; overflow-wrap: anywhere; text-wrap: pretty;
    margin:0; font-family:"Helvetica Neue","Yu Gothic",sans-serif;
    background:#ffffff; color:#111; letter-spacing:.02em;
  }
  h1,h2,h3,h4{ text-wrap: balance; font-weight:300; }
  .nb{ white-space: nowrap; }
  .url,code{ word-break: break-all; }

  .shell{ max-width:760px; margin:0 auto; padding:0 24px; }
  header{ padding:110px 0 70px; border-bottom:1px solid #111; }
  header h1{ font-size:2.6rem; margin:0 0 20px; }
  header p{ font-size:.95rem; opacity:.6; }
  section{ padding:56px 0; border-bottom:1px solid #eee; }
  .kodawari{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:#111; }
  .card{ background:#fff; padding:28px 20px; }
  .card h3{ font-size:1rem; margin:0 0 10px; }
  .card p{ font-size:.85rem; opacity:.7; line-height:1.8; }
  .menu{ list-style:none; padding:0; }
  .menu li{ display:flex; justify-content:space-between; padding:18px 0; border-bottom:1px solid #eee; font-size:.95rem; }
  footer{ padding:60px 0; font-size:.85rem; opacity:.6; }
  .btn{
    display:inline-block; margin-top:24px; padding:16px 40px;
    background:#111; color:#fff; text-decoration:none; font-size:.85rem; letter-spacing:.1em;
  }
  @media (max-width:600px){ .kodawari{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="shell">
  <header>
    <h1><span class="nb">ひだまり珈琲店</span></h1>
    <p>街の片隅で、香り立つ一杯を</p>
    <a class="btn" href="#">ご予約はこちら</a>
  </header>

  <section class="kodawari">
    <div class="card"><h3>01 / 自家焙煎</h3><p>毎朝、店の奥で豆を焙煎しています。</p></div>
    <div class="card"><h3>02 / 産地直送</h3><p>生産者から直接仕入れた豆だけを使用。</p></div>
    <div class="card"><h3>03 / 手網焙煎</h3><p>週末は店頭で実演もしています。</p></div>
  </section>

  <section>
    <h2>Menu</h2>
    <ul class="menu">
      <li><span>ブレンド</span><span>¥500</span></li>
      <li><span>カフェラテ</span><span>¥550</span></li>
      <li><span>季節のケーキ</span><span>¥480</span></li>
    </ul>
  </section>

  <footer>
    <p><span class="nb">みなと中央駅</span>から徒歩5分／8:00〜19:00（日曜定休）</p>
  </footer>
</div>

<script type="module">
  function tidyCJKWhitespace(root){
    const CJK = /[　-ヿ㐀-䶿一-鿿ｦ-ﾟ]/;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let n;
    while((n = walker.nextNode())){
      n.nodeValue = n.nodeValue.replace(
        /([^\s])[ \t]*\n[ \t]*([^\s])/g,
        (m, a, b) => CJK.test(a) && CJK.test(b) ? a + b : a + ' ' + b
      );
    }
  }
  try{
    const { loadDefaultJapaneseParser } = await import('https://cdn.jsdelivr.net/npm/budoux@0.6.2/+esm');
    const parser = loadDefaultJapaneseParser();
    document.querySelectorAll('.shell').forEach(el => { tidyCJKWhitespace(el); parser.applyToElement(el); });
  }catch(e){}
</script>
</body>
</html>
