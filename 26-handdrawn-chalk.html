<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ひだまり珈琲店 | 手描きメニュー</title><style>
:root{--chalk:#f6f0df;--board:#24352f;--orange:#e8935d;--mint:#a9c5a3}*{box-sizing:border-box}body{margin:0;background:var(--chalk);color:var(--board);font-family:'Trebuchet MS','Yu Gothic',sans-serif;word-break:keep-all;overflow-wrap:anywhere;text-wrap:pretty}.wall{max-width:1100px;margin:auto;min-height:100vh;padding:28px 5vw 70px}.top{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.16em;border-bottom:2px solid var(--board);padding-bottom:15px}.board{margin-top:42px;background:var(--board);color:var(--chalk);padding:clamp(28px,6vw,72px);position:relative;box-shadow:16px 18px 0 var(--orange);min-height:560px}.board:before,.board:after{content:'';position:absolute;border-top:2px solid var(--mint);width:30%;transform:rotate(-4deg);opacity:.7}.board:before{top:28px;left:5%}.board:after{bottom:30px;right:5%;transform:rotate(5deg)}h1{font-size:clamp(3rem,10vw,8.4rem);line-height:.86;letter-spacing:-.1em;margin:0 0 25px;font-weight:900;color:var(--orange);text-shadow:3px 3px 0 var(--mint)}h1 span{display:block;color:var(--chalk);text-shadow:none}.scribble{font-family:cursive;font-size:1.15rem;color:var(--mint);transform:rotate(-3deg);display:inline-block;margin-bottom:24px}.menu{display:grid;grid-template-columns:1fr 1fr;gap:16px 70px;margin-top:30px;border-top:1px solid var(--mint);padding-top:20px}.item{display:flex;justify-content:space-between;gap:14px;border-bottom:2px dotted var(--mint);padding:10px 0;font-size:1.1rem}.item strong{color:var(--orange)}.info{margin:65px 4% 0;display:grid;grid-template-columns:1fr 1fr;gap:30px}.info h2{font-size:1.7rem;margin:0 0 8px;text-decoration:underline;text-decoration-style:wavy;text-decoration-color:var(--orange)}.info p{margin:0;line-height:2}.stamp{border:2px solid var(--orange);padding:14px;transform:rotate(3deg);font-size:13px;align-self:start}@media(max-width:640px){.wall{padding:16px 20px 52px}.board{margin-top:25px;padding:38px 22px;box-shadow:9px 11px 0 var(--orange);min-height:0}.board:before{top:18px}.board:after{bottom:18px}.menu{grid-template-columns:1fr;gap:2px;margin-top:22px}.item{font-size:1rem}.info{grid-template-columns:1fr;margin:48px 0 0;gap:25px}.stamp{justify-self:stretch}h1{font-size:clamp(3.4rem,17vw,6rem)}}
</style></head><body><main class="wall"><header class="top"><span>HAND DRAWN MENU WALL</span><span>ひだまり珈琲店</span></header><section class="board"><div class="scribble">街の片隅で、香り立つ一杯を</div><h1>ひだまり<span>珈琲店</span></h1><div class="menu"><div class="item"><span>ブレンド</span><strong>500円</strong></div><div class="item"><span>カフェラテ</span><strong>550円</strong></div><div class="item"><span>季節のケーキ</span><strong>480円</strong></div><div class="item"><span>自家焙煎</span><strong>本日の豆</strong></div></div></section><section class="info"><div><h2>手網焙煎の香り</h2><p>産地直送の豆を少量ずつ、手で焙煎しています。今日もゆっくり、おいしく。</p></div><div class="stamp">みなと中央駅<br>8:00〜19:00<br>日曜定休</div></section></main></body></html>
