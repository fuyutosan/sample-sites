<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ひだまり珈琲店 — 縦書き便り</title><link rel="preconnect" href="https://fonts.googleapis.com/"><link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#22231f;--red:#ad3e2e;--cream:#eee8d8}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"Zen Old Mincho",serif;word-break:keep-all;overflow-wrap:anywhere;text-wrap:pretty}.sheet{min-height:100vh;padding:6vh 7vw;position:relative;overflow:hidden}.sheet:before{content:"";position:absolute;inset:24px;border:1px solid #c9bfa7;pointer-events:none}.date{position:absolute;top:8vh;left:8vw;color:var(--red);font:12px sans-serif;letter-spacing:.18em}.title{height:73vh;display:flex;flex-direction:row-reverse;justify-content:center;align-items:center;gap:clamp(25px,5vw,85px);writing-mode:vertical-rl}.title h1{font-size:clamp(45px,7vw,100px);line-height:1.15;letter-spacing:.12em;font-weight:600;margin:0}.title p{font-size:15px;line-height:2.3;letter-spacing:.14em;margin:0}.stamp{width:55px;height:55px;border:2px solid var(--red);color:var(--red);border-radius:50%;font-size:12px;display:grid;place-items:center;writing-mode:vertical-rl}.bar{border-top:1px solid var(--ink);padding-top:18px;display:flex;justify-content:space-between;align-items:start}.menu{display:flex;gap:35px;writing-mode:vertical-rl;height:150px;font-size:16px}.menu span{padding-left:18px;border-left:1px solid #c9bfa7}.info{text-align:right;font-size:12px;line-height:2}.mobile-note{display:none}@media(max-width:640px){.sheet{padding:24px 20px;overflow:visible}.sheet:before{inset:10px}.date{top:25px;left:auto;right:24px}.title{height:auto;display:block;writing-mode:horizontal-tb;padding:90px 10px 45px}.title h1{font-size:49px;line-height:1.2;letter-spacing:-.08em}.title p{font-size:14px;line-height:2;margin-top:30px}.stamp{margin-top:26px;width:45px;height:45px}.bar{display:block;padding:22px 10px 0}.menu{height:auto;display:grid;gap:0;writing-mode:horizontal-tb}.menu span{padding:15px 0;border-left:0;border-bottom:1px solid #c9bfa7}.info{text-align:left;margin-top:25px;line-height:2.2}.mobile-note{display:block;font-size:13px;margin-top:32px;color:var(--red)}}
</style></head><body><main class="sheet"><span class="date">令和六年　珈琲便り</span><section class="title"><h1>街の片隅で、香り立つ一杯を</h1><p>自家焙煎。産地直送の豆。<br>手網焙煎の香り。<br>ひと息つくための場所です。</p><span class="stamp">陽</span></section><section class="bar"><div class="menu"><span>ブレンド　500円</span><span>カフェラテ　550円</span><span>季節のケーキ　480円</span></div><div class="info">ひだまり珈琲店<br>みなと中央駅<br>8:00〜19:00　日曜定休</div><p class="mobile-note">暖簾をくぐるように、どうぞ。</p></section></main></body></html>
