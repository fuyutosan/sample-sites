<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひだまり珈琲店｜ヴィンテージ・クラフト紙</title>
<style>
  body{
    word-break: keep-all; overflow-wrap: anywhere; text-wrap: pretty;
    margin:0; font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;
    background:#e8ddc8; color:#4a3826;
  }
  h1,h2,h3,h4{ text-wrap: balance; }
  .nb{ white-space: nowrap; }
  .url,code{ word-break: break-all; }

  .shell{ max-width:820px; margin:24px auto; border:3px double #7a5c3e; background:#f0e6d2; }
  header{ padding:60px 24px 40px; text-align:center; border-bottom:3px double #7a5c3e; }
  header h1{ font-size:2.2rem; margin:0 0 12px; }
  section{ padding:44px 24px; }
  .kodawari{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:24px; }
  .card{ background:#fff9ec; border:1px solid #c9b48f; padding:22px; }
  .card h3{ margin-top:0; text-decoration:underline wavy #7a5c3e; }
  .menu{ list-style:none; padding:0; max-width:420px; margin:0 auto; }
  .menu li{ display:flex; justify-content:space-between; padding:14px 0; border-bottom:1px solid #c9b48f; }
  footer{ text-align:center; padding:32px 24px; border-top:3px double #7a5c3e; }
  .btn{
    display:inline-block; margin-top:16px; padding:14px 32px;
    background:#7a5c3e; color:#f0e6d2; text-decoration:none; border-radius:2px;
  }
  .stamp{ display:inline-block; border:2px solid #b23; color:#b23; padding:4px 10px; transform:rotate(-4deg); font-size:.8rem; }
</style>
</head>
<body>
<div class="shell">
  <header>
    <p class="stamp">EST. 珈琲</p>
    <h1><span class="nb">ひだまり珈琲店</span></h1>
    <p>街の片隅で、香り立つ一杯を</p>
    <a class="btn" href="#">ご予約はこちら</a>
  </header>

  <section class="kodawari">
    <div class="card"><h3>自家焙煎</h3><p>毎朝、店の奥で豆を焙煎しています。</p></div>
    <div class="card"><h3>産地直送の豆</h3><p>生産者から直接仕入れた豆だけを使用します。</p></div>
    <div class="card"><h3>手網焙煎の香り</h3><p>週末は店頭で実演もしています。</p></div>
  </section>

  <section>
    <h2 style="text-align:center;">メニュー</h2>
    <ul class="menu">
      <li><span>ブレンド</span><span>500円</span></li>
      <li><span>カフェラテ</span><span>550円</span></li>
      <li><span>季節のケーキ</span><span>480円</span></li>
    </ul>
  </section>

  <footer>
    <p><span class="nb">みなと中央駅</span>から徒歩5分</p>
    <p>営業時間：8:00〜19:00（日曜定休）</p>
  </footer>
</div>

<script type="module">
  function tidyCJKWhitespace(root){
    const CJK = /[　-ヿ㐀-䶿一-鿿ｦ-ﾟ]/;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let n;
    while((n = walker.nextNode())){
      n.nodeValue = n.nodeValue.replace(
        /([^\s])[ \t]*\n[ \t]*([^\s])/g,
        (m, a, b) => CJK.test(a) && CJK.test(b) ? a + b : a + ' ' + b
      );
    }
  }
  try{
    const { loadDefaultJapaneseParser } = await import('https://cdn.jsdelivr.net/npm/budoux@0.6.2/+esm');
    const parser = loadDefaultJapaneseParser();
    document.querySelectorAll('.shell').forEach(el => { tidyCJKWhitespace(el); parser.applyToElement(el); });
  }catch(e){}
</script>
</body>
</html>
