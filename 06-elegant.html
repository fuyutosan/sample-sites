<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひだまり珈琲店｜エレガント・ゴールド</title>
<style>
  body{
    word-break: keep-all; overflow-wrap: anywhere; text-wrap: pretty;
    margin:0; font-family:"游明朝","Yu Mincho",serif;
    background:#0f0f10; color:#e9e2cf;
  }
  h1,h2,h3,h4{ text-wrap: balance; }
  .nb{ white-space: nowrap; }
  .url,code{ word-break: break-all; }

  .shell{ max-width:820px; margin:0 auto; }
  header{ padding:110px 24px 80px; text-align:center; border-bottom:1px solid #b89b5e; }
  header h1{ font-size:2.4rem; margin:0 0 16px; color:#d4af6a; letter-spacing:.2em; }
  header p{ opacity:.75; letter-spacing:.1em; }
  section{ padding:60px 24px; }
  .kodawari{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:36px; text-align:center; }
  .card h3{ color:#d4af6a; border-bottom:1px solid #b89b5e; display:inline-block; padding-bottom:8px; }
  .menu{ list-style:none; padding:0; max-width:420px; margin:0 auto; }
  .menu li{ display:flex; justify-content:space-between; padding:18px 0; border-bottom:1px dotted #b89b5e; }
  footer{ text-align:center; padding:50px 24px; border-top:1px solid #b89b5e; opacity:.75; }
  .btn{
    display:inline-block; margin-top:24px; padding:16px 44px;
    border:1px solid #d4af6a; color:#d4af6a; text-decoration:none; letter-spacing:.15em;
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <h1><span class="nb">ひだまり珈琲店</span></h1>
    <p>街の片隅で、香り立つ一杯を</p>
    <a class="btn" href="#">ご予約はこちら</a>
  </header>

  <section class="kodawari">
    <div class="card"><h3>自家焙煎</h3><p>毎朝、店の奥で豆を焙煎しています。</p></div>
    <div class="card"><h3>産地直送の豆</h3><p>生産者から直接仕入れた豆だけを使用します。</p></div>
    <div class="card"><h3>手網焙煎の香り</h3><p>週末は店頭で実演もしています。</p></div>
  </section>

  <section>
    <h2 style="text-align:center; color:#d4af6a;">Menu</h2>
    <ul class="menu">
      <li><span>ブレンド</span><span>¥500</span></li>
      <li><span>カフェラテ</span><span>¥550</span></li>
      <li><span>季節のケーキ</span><span>¥480</span></li>
    </ul>
  </section>

  <footer>
    <p><span class="nb">みなと中央駅</span>から徒歩5分／8:00〜19:00（日曜定休）</p>
  </footer>
</div>

<script type="module">
  function tidyCJKWhitespace(root){
    const CJK = /[　-ヿ㐀-䶿一-鿿ｦ-ﾟ]/;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let n;
    while((n = walker.nextNode())){
      n.nodeValue = n.nodeValue.replace(
        /([^\s])[ \t]*\n[ \t]*([^\s])/g,
        (m, a, b) => CJK.test(a) && CJK.test(b) ? a + b : a + ' ' + b
      );
    }
  }
  try{
    const { loadDefaultJapaneseParser } = await import('https://cdn.jsdelivr.net/npm/budoux@0.6.2/+esm');
    const parser = loadDefaultJapaneseParser();
    document.querySelectorAll('.shell').forEach(el => { tidyCJKWhitespace(el); parser.applyToElement(el); });
  }catch(e){}
</script>
</body>
</html>
